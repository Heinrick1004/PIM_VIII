name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403
      - run: dotnet restore TaskFlow.sln
      - run: dotnet build TaskFlow.sln --configuration Release --no-restore
      - run: dotnet test tests/TaskFlow.Tests/TaskFlow.Tests.csproj --configuration Release --no-restore --filter "Category!=SqlServer"
      - run: dotnet test tests/TaskFlow.Desktop.Tests/TaskFlow.Desktop.Tests.csproj --configuration Release --no-restore

  containers:
    runs-on: ubuntu-latest
    needs: dotnet
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file infra/docker/Dockerfile.api --tag taskflow-api:ci .
      - name: Build MVC image
        run: docker build --file infra/docker/Dockerfile.web --tag taskflow-web:ci .
